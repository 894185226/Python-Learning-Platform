<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>系统监控 - Python 基础学习平台</title>
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
<style>
/* ===== 监控面板专用样式 ===== */
.monitor-container {
    max-width: 1200px;
    margin: 0 auto;
    padding: 20px;
}

.monitor-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 20px;
    flex-wrap: wrap;
    gap: 12px;
}

.monitor-header h1 {
    font-size: 1.5rem;
    color: var(--text-primary);
    margin: 0;
}

.monitor-status {
    display: flex;
    align-items: center;
    gap: 12px;
    font-size: 0.9rem;
}

.status-dot {
    width: 10px;
    height: 10px;
    border-radius: 50%;
    display: inline-block;
    animation: pulse 2s infinite;
}

.status-dot.ok { background: #04aa6d; }
.status-dot.degraded { background: #f0ad4e; }
.status-dot.error { background: #d9534f; }

@keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.4; }
}

.refresh-timer {
    color: var(--text-secondary);
    font-size: 0.85rem;
}

/* 卡片网格 */
.metrics-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
    gap: 16px;
    margin-bottom: 20px;
}

.metric-card {
    background: var(--bg-card);
    border: 1px solid var(--border-color);
    border-radius: 10px;
    padding: 16px;
    transition: box-shadow 0.2s;
}

.metric-card:hover {
    box-shadow: 0 2px 12px rgba(0,0,0,0.08);
}

.metric-card h3 {
    font-size: 0.85rem;
    color: var(--text-secondary);
    margin: 0 0 12px 0;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    display: flex;
    align-items: center;
    gap: 6px;
}

.metric-card h3 i {
    font-size: 1rem;
    width: 20px;
}

.metric-value {
    font-size: 2rem;
    font-weight: 700;
    color: var(--text-primary);
    line-height: 1.2;
}

.metric-value.small {
    font-size: 1.5rem;
}

.metric-sub {
    font-size: 0.8rem;
    color: var(--text-secondary);
    margin-top: 4px;
}

/* 进度条 */
.progress-bar {
    height: 8px;
    background: var(--bg-secondary);
    border-radius: 4px;
    margin-top: 8px;
    overflow: hidden;
}

.progress-fill {
    height: 100%;
    border-radius: 4px;
    transition: width 0.5s ease;
}

.progress-fill.safe { background: #04aa6d; }
.progress-fill.warn { background: #f0ad4e; }
.progress-fill.danger { background: #d9534f; }

/* 连接池状态 */
.pool-stats {
    display: flex;
    gap: 16px;
    flex-wrap: wrap;
}

.pool-item {
    text-align: center;
    flex: 1;
    min-width: 60px;
}

.pool-item .num {
    font-size: 1.8rem;
    font-weight: 700;
}

.pool-item .label {
    font-size: 0.75rem;
    color: var(--text-secondary);
}

/* 请求路径表格 */
.path-table {
    width: 100%;
    border-collapse: collapse;
    font-size: 0.85rem;
}

.path-table th {
    text-align: left;
    padding: 8px 12px;
    border-bottom: 2px solid var(--border-color);
    color: var(--text-secondary);
    font-weight: 600;
}

.path-table td {
    padding: 6px 12px;
    border-bottom: 1px solid var(--border-color);
}

.path-table .path-cell {
    font-family: 'Consolas', 'Courier New', monospace;
    font-size: 0.8rem;
    max-width: 300px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
}

.path-table .err-badge {
    display: inline-block;
    background: #fff3cd;
    color: #856404;
    padding: 1px 6px;
    border-radius: 3px;
    font-size: 0.75rem;
}

/* 全宽卡片 */
.metric-card.full-width {
    grid-column: 1 / -1;
}

/* 响应式 */
@media (max-width: 768px) {
    .metrics-grid {
        grid-template-columns: 1fr;
    }
}

/* 小字体文本 */
.text-mono {
    font-family: 'Consolas', 'Courier New', monospace;
    font-size: 0.8rem;
}

/* 错误颜色 */
.text-danger { color: #d9534f; }
.text-warning { color: #f0ad4e; }
.text-success { color: #04aa6d; }
</style>
</head>
<body>
<!-- 导航栏 -->
<nav class="navbar">
    <div class="nav-container">
        <a href="/" class="nav-logo">
            <i class="fas fa-code"></i> Python 基础学习平台
        </a>
        <div class="nav-links">
            <a href="/">首页</a>
            <a href="/admin.html">管理后台</a>
            <a href="/monitor.html" class="active">系统监控</a>
        </div>
    </div>
</nav>

<div class="monitor-container">
    <!-- 头部 -->
    <div class="monitor-header">
        <h1><i class="fas fa-heartbeat"></i> 系统监控面板</h1>
        <div class="monitor-status">
            <span class="status-dot ok" id="statusDot"></span>
            <span id="statusText">运行中</span>
            <span class="refresh-timer" id="refreshTimer">刷新: 5s</span>
        </div>
    </div>

    <!-- 指标卡片 -->
    <div class="metrics-grid">
        <!-- 服务器信息 -->
        <div class="metric-card">
            <h3><i class="fas fa-server"></i> 服务器</h3>
            <div class="metric-value small" id="serverUptime">--</div>
            <div class="metric-sub" id="serverInfo">--</div>
        </div>

        <!-- 请求指标 -->
        <div class="metric-card">
            <h3><i class="fas fa-chart-line"></i> 请求速率</h3>
            <div class="metric-value" id="reqCount">0</div>
            <div class="metric-sub">请求/分钟</div>
        </div>

        <!-- 响应时间 -->
        <div class="metric-card">
            <h3><i class="fas fa-clock"></i> 响应时间</h3>
            <div class="metric-value small" id="respTime">0ms</div>
            <div class="metric-sub" id="respRange">--</div>
        </div>

        <!-- 错误率 -->
        <div class="metric-card">
            <h3><i class="fas fa-exclamation-triangle"></i> 错误率</h3>
            <div class="metric-value" id="errorRate">0%</div>
            <div class="metric-sub" id="errorDetail">--</div>
        </div>

        <!-- 内存使用 -->
        <div class="metric-card">
            <h3><i class="fas fa-memory"></i> 内存 (Heap)</h3>
            <div class="metric-value small" id="heapUsed">--</div>
            <div class="progress-bar">
                <div class="progress-fill safe" id="heapBar" style="width:0%"></div>
            </div>
            <div class="metric-sub" id="heapDetail">--</div>
        </div>

        <!-- 系统内存 -->
        <div class="metric-card">
            <h3><i class="fas fa-desktop"></i> 系统内存</h3>
            <div class="metric-value small" id="sysMem">--</div>
            <div class="progress-bar">
                <div class="progress-fill safe" id="sysMemBar" style="width:0%"></div>
            </div>
            <div class="metric-sub" id="sysMemDetail">--</div>
        </div>

        <!-- CPU -->
        <div class="metric-card">
            <h3><i class="fas fa-microchip"></i> CPU</h3>
            <div class="metric-value small" id="cpuModel">--</div>
            <div class="metric-sub" id="cpuLoad">--</div>
        </div>

        <!-- 连接池 -->
        <div class="metric-card">
            <h3><i class="fas fa-database"></i> 数据库连接池</h3>
            <div class="pool-stats">
                <div class="pool-item">
                    <div class="num" id="poolTotal">0</div>
                    <div class="label">总连接</div>
                </div>
                <div class="pool-item">
                    <div class="num text-success" id="poolIdle">0</div>
                    <div class="label">空闲</div>
                </div>
                <div class="pool-item">
                    <div class="num" id="poolWaiting">0</div>
                    <div class="label">等待</div>
                </div>
                <div class="pool-item">
                    <div class="num" id="poolActive">0</div>
                    <div class="label">活跃</div>
                </div>
            </div>
        </div>

        <!-- 会话 -->
        <div class="metric-card">
            <h3><i class="fas fa-users"></i> 在线会话</h3>
            <div class="pool-stats">
                <div class="pool-item">
                    <div class="num" id="studentSessions">0</div>
                    <div class="label">学生</div>
                </div>
                <div class="pool-item">
                    <div class="num" id="adminSessions">0</div>
                    <div class="label">管理员</div>
                </div>
            </div>
        </div>

        <!-- 累计统计 -->
        <div class="metric-card">
            <h3><i class="fas fa-history"></i> 累计统计</h3>
            <div class="metric-sub" id="totalStats">--</div>
        </div>

        <!-- 请求路径 Top 10 -->
        <div class="metric-card full-width">
            <h3><i class="fas fa-list-ol"></i> 请求路径 Top 10</h3>
            <div style="overflow-x:auto;">
                <table class="path-table">
                    <thead>
                        <tr>
                            <th>#</th>
                            <th>路径</th>
                            <th>请求数</th>
                            <th>平均响应</th>
                            <th>错误</th>
                        </tr>
                    </thead>
                    <tbody id="pathTableBody">
                        <tr><td colspan="5" style="text-align:center;color:var(--text-secondary);">加载中...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>

<script>
// ===================================================
// 监控面板脚本
// ===================================================

const REFRESH_INTERVAL = 5000; // 5 秒刷新
let refreshCountdown = REFRESH_INTERVAL / 1000;
let adminToken = '';

// 登录获取 token
async function login() {
    try {
        const resp = await fetch('/api/admin/login', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ username: 'admin', password: 'admin123' })
        });
        const data = await resp.json();
        if (data.success) {
            adminToken = data.token;
            return true;
        }
    } catch (e) {
        console.error('监控登录失败:', e);
    }
    return false;
}

// 获取监控数据
async function fetchMonitor() {
    if (!adminToken) {
        const ok = await login();
        if (!ok) {
            document.getElementById('statusText').textContent = '登录失败';
            document.getElementById('statusDot').className = 'status-dot error';
            return;
        }
    }

    try {
        const resp = await fetch('/api/admin/monitor', {
            headers: { 'x-admin-token': adminToken }
        });
        const data = await resp.json();
        if (data.success) {
            renderMonitor(data.monitor);
        } else {
            // token 可能过期，重新登录
            adminToken = '';
        }
    } catch (e) {
        console.error('获取监控数据失败:', e);
    }
}

// 渲染监控数据
function renderMonitor(m) {
    // 状态
    const statusDot = document.getElementById('statusDot');
    const statusText = document.getElementById('statusText');
    statusDot.className = 'status-dot ok';
    statusText.textContent = '运行中';

    // 服务器
    const uptime = m.server.uptime;
    const h = Math.floor(uptime / 3600);
    const min = Math.floor((uptime % 3600) / 60);
    const s = Math.floor(uptime % 60);
    document.getElementById('serverUptime').textContent =
        h > 0 ? `${h}h ${min}m ${s}s` : `${min}m ${s}s`;
    document.getElementById('serverInfo').textContent =
        `Node ${m.server.nodeVersion} | ${m.server.platform} | 启动于 ${formatTime(m.server.startedAt)}`;

    // 请求
    const cur = m.requests.currentWindow;
    document.getElementById('reqCount').textContent = cur.count;
    document.getElementById('respTime').textContent = cur.avgResponseTime + 'ms';
    document.getElementById('respRange').textContent =
        `最快 ${cur.minResponseTime}ms / 最慢 ${cur.maxResponseTime}ms`;

    // 错误率
    const errEl = document.getElementById('errorRate');
    const errRate = cur.errorRate;
    errEl.textContent = errRate + '%';
    errEl.className = 'metric-value ' +
        (errRate === 0 ? 'text-success' : errRate < 5 ? 'text-warning' : 'text-danger');
    document.getElementById('errorDetail').textContent =
        `4xx: ${cur.error4xx} | 5xx: ${cur.error5xx}`;

    // 内存 Heap
    const heapPct = m.memory.heapTotal > 0 ? Math.round(m.memory.heapUsed / m.memory.heapTotal * 100) : 0;
    document.getElementById('heapUsed').textContent = m.memory.heapUsed + ' MB';
    document.getElementById('heapDetail').textContent =
        `总计 ${m.memory.heapTotal} MB | RSS ${m.memory.rss} MB`;
    setBar('heapBar', heapPct);

    // 系统内存
    document.getElementById('sysMem').textContent = m.memory.systemUsage + '%';
    document.getElementById('sysMemDetail').textContent =
        `已用 ${formatMB(m.memory.systemTotal - m.memory.systemFree)} / ${formatMB(m.memory.systemTotal)} GB`;
    setBar('sysMemBar', m.memory.systemUsage);

    // CPU
    document.getElementById('cpuModel').textContent = m.cpu.cores + ' 核心';
    document.getElementById('cpuLoad').textContent =
        `负载: ${m.cpu.loadAvg.join(' / ')} | ${m.cpu.model}`;

    // 连接池
    const pool = m.pool;
    document.getElementById('poolTotal').textContent = pool.total;
    document.getElementById('poolIdle').textContent = pool.idle;
    document.getElementById('poolWaiting').textContent = pool.waiting;
    document.getElementById('poolActive').textContent = pool.total - pool.idle;

    // 会话
    document.getElementById('studentSessions').textContent = m.sessions || 0;
    document.getElementById('adminSessions').textContent = m.adminSessions || 0;

    // 累计统计
    const total = m.requests.total;
    document.getElementById('totalStats').innerHTML =
        `总请求: <strong>${total.requestCount}</strong> | ` +
        `总错误: <strong>${total.error4xx + total.error5xx}</strong> ` +
        `(4xx: ${total.error4xx}, 5xx: ${total.error5xx})`;

    // Top 路径
    const tbody = document.getElementById('pathTableBody');
    if (m.requests.topPaths && m.requests.topPaths.length > 0) {
        tbody.innerHTML = m.requests.topPaths.map((p, i) => `
            <tr>
                <td>${i + 1}</td>
                <td class="path-cell" title="${p.path}">${p.path}</td>
                <td>${p.count}</td>
                <td>${p.avgTime}ms</td>
                <td>${p.errors > 0 ? `<span class="err-badge">${p.errors}</span>` : '-'}</td>
            </tr>
        `).join('');
    } else {
        tbody.innerHTML = '<tr><td colspan="5" style="text-align:center;color:var(--text-secondary);">暂无请求数据</td></tr>';
    }
}

function setBar(id, pct) {
    const bar = document.getElementById(id);
    bar.style.width = pct + '%';
    bar.className = 'progress-fill ' +
        (pct < 60 ? 'safe' : pct < 85 ? 'warn' : 'danger');
}

function formatTime(iso) {
    if (!iso) return '--';
    const d = new Date(iso);
    return d.toLocaleTimeString('zh-CN', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
}

function formatMB(mb) {
    if (mb > 1024) return (mb / 1024).toFixed(1);
    return mb.toString();
}

// 倒计时刷新
function updateCountdown() {
    refreshCountdown--;
    if (refreshCountdown <= 0) {
        refreshCountdown = REFRESH_INTERVAL / 1000;
        fetchMonitor();
    }
    document.getElementById('refreshTimer').textContent = `刷新: ${refreshCountdown}s`;
}

// 启动
(async function init() {
    await fetchMonitor();
    setInterval(updateCountdown, 1000);
})();
</script>
</body>
</html>
